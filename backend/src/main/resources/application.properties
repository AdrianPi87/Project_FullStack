spring.application.name=product-configurator
server.port=8080

spring.datasource.url=jdbc:h2:mem:configdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoints.web.exposure.include=health,info,prometheus

logging.level.com.demo.configurator=INFO

app.jwt.secret=${APP_JWT_SECRET:change-me-please-use-a-very-long-secret-key-for-demo-2026}
app.jwt.expiration-ms=86400000
